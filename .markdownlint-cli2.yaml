# markdownlint config for the docs repo.
config:
  # Line length: impractical for docs (raw GitHub image URLs can't be wrapped).
  MD013: false
  # Allow inline HTML — Archbee pages and headerincludes may use it.
  MD033: false
  # First line need not be a top-level heading (section pages start with frontmatter-free H1 anyway, but be lenient).
  MD041: false
  # Content is generated/copied from source repos; these cosmetic style rules recur
  # throughout and can't be durably fixed here, so don't block the sync on them.
  # markdownlint stays enabled for everything else (genuinely broken structure).
  MD001: false   # heading-increment jumps (Archbee exports skip levels within a section)
  MD024: false   # duplicate headings (e.g. repeated "### Endpoint" per example)
  MD025: false   # multiple H1s: exported reference pages carry a frontmatter title plus one H1 per property/method
  MD026: false   # trailing punctuation in headings
  MD029: false   # ordered-list item numbering style
  MD031: false   # blanks around fenced code blocks
  MD032: false   # blanks around lists
  MD036: false   # emphasis used instead of a heading
  MD040: false   # fenced code blocks without a language hint
  MD047: false   # single trailing newline
  MD060: false   # table column pipe alignment

# Files that are Archbee structural config, not prose — don't lint them.
ignores:
  - "docs/Summary.md"   # Archbee nav tree (GitBook-style bulleted TOC), not prose
  - "docs/config.md"    # use{file=...} code-embed declarations (HTML comments)
