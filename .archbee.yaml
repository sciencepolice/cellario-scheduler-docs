# Archbee GitHub sync configuration.
# Layout mirrors Archbee's canonical example (github.com/dragosbulugean/slate):
# a GitBook-style readme + Summary pair drives the space.
#   readme  -> Introduction.md (space home page)
#   summary -> Summary.md (bulleted nav tree; drives left-nav order and grouping)
#   assets  -> folder for GitHub-hosted images
# Sync is one-way (GitHub -> Archbee) and fires on every push to the synced branch.
root: ./docs
structure:
  readme: Introduction.md
  summary: Summary.md
  assets: assets
publishspace: true

# Shadow docs are synced and indexed for the Ask-AI assistant but NOT shown on the
# published portal nav. Paths are relative to `root` (./docs).
shadowdocs:
  - api/api/scripting-api-reference.md

# Sample source folders (docs/api/samples, docs/scripting/samples) are intentionally
# NOT shadow-docs — they stay in the repo for inline use{file="..."} embeds only
# (see docs/config.md). Archbee has no ignore key, so anything added here is synced
# recursively; enumerate specific paths rather than whole sample trees.
